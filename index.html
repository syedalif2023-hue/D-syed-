<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syed Information - Card Maker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        
        /* The ID Card Styling */
        #labor-card {
            width: 320px;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); /* Premium Gradient */
            color: white;
            padding: 20px;
            border-radius: 15px;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .photo-box {
            width: 85px;
            height: 105px;
            background: white;
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255,255,255,0.5);
        }
        #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .placeholder { color: #ccc; font-size: 40px; }

        .details { flex-grow: 1; }
        .details h3 { margin: 0 0 10px 0; font-size: 16px; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 5px; text-align: center;}
        .info-item { margin-bottom: 5px; }
        .info-item label { font-size: 9px; text-transform: uppercase; opacity: 0.8; display: block; }
        .info-item span { font-size: 13px; font-weight: bold; }

        .status-badge { position: absolute; top: 10px; right: 10px; background: #4CAF50; color: white; font-size: 9px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }

        /* Form Styling */
        .form-area { width: 320px; margin-top: 25px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        .file-label { display: block; background: #eee; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; margin-bottom: 10px; font-size: 14px; border: 1px dashed #999; }
        #file-input { display: none; }

        .share-btn {
            width: 100%;
            padding: 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .share-btn:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h2 style="color: #333;">Syed Information</h2>

    <div id="labor-card">
        <span class="status-badge">VERIFIED ACTIVE</span>
        <div class="photo-box">
            <img id="preview-img" src="">
            <span class="placeholder" id="icon">👤</span>
        </div>
        <div class="details">
            <h3>LABOR CARD</h3>
            <div class="info-item">
                <label>Name</label>
                <span id="card-name">---</span>
            </div>
            <div class="info-item">
                <label>Contact</label>
                <span id="card-phone">---</span>
            </div>
            <div class="info-item">
                <label>Aadhaar</label>
                <span id="card-aadhaar">---</span>
            </div>
        </div>
    </div>

    <div class="form-area">
        <label for="file-input" class="file-label">📸 Upload Photo</label>
        <input type="file" id="file-input" accept="image/*" onchange="loadPhoto(event)">

        <input type="text" id="inName" placeholder="Full Name" oninput="syncText()">
        <input type="number" id="inPhone" placeholder="Phone Number" oninput="syncText()">
        <input type="number" id="inAadhar" placeholder="Aadhaar Number" oninput="syncText()">

        <button class="share-btn" onclick="shareCard()">CREATE & SHARE PHOTO</button>
    </div>

<script>
    function loadPhoto(event) {
        const output = document.getElementById('preview-img');
        const icon = document.getElementById('icon');
        output.src = URL.createObjectURL(event.target.files[0]);
        output.style.display = "block";
        icon.style.display = "none";
    }

    function syncText() {
        document.getElementById('card-name').innerText = document.getElementById('inName').value.toUpperCase() || "---";
        document.getElementById('card-phone').innerText = document.getElementById('inPhone').value || "---";
        document.getElementById('card-aadhaar').innerText = document.getElementById('inAadhar').value || "---";
    }

    async function shareCard() {
        const cardElement = document.getElementById('labor-card');
        
        // 1. Card ko Canvas (Image) mein convert karein
        const canvas = await html2canvas(cardElement, { useCORS: true });
        
        canvas.toBlob(async (blob) => {
            const file = new File([blob], 'LaborCard.png', { type: 'image/png' });
            
            // 2. Check if browser supports sharing files
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: 'Labor Card',
                        text: 'Syed Information Services - Verified Card'
                    });
                } catch (error) {
                    console.error('Sharing failed', error);
                }
            } else {
                // Agar share support nahi hai toh download ho jayega
                const link = document.createElement('a');
                link.download = 'Labor-Card.png';
                link.href = canvas.toDataURL();
                link.click();
                alert("Sharing not supported, Photo saved to gallery!");
            }
        });
    }
</script>

</body>
</html>
