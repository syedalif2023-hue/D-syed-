<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Registration Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-500 to-indigo-900 min-h-screen flex items-center justify-center p-6">

    <div class="glass-effect w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden">
        <div class="bg-indigo-600 p-6 text-center">
            <h2 class="text-2xl font-bold text-white uppercase tracking-wider">Business Registration</h2>
            <p class="text-indigo-100 text-sm mt-1">Please fill in your details below</p>
        </div>

        <form action="https://script.google.com/macros/s/AKfycbyoXDOiq1b36eqLm0qHPs7F1HYvHsfBq7fI9duVYybzn5T9BVPVITukd3oke9I_W6jZ/exec" method="POST" class="p-8 space-y-5">
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
                <input type="text" name="name" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                    placeholder="Enter your name">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                <input type="email" name="email" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                    placeholder="syed@example.com">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Phone Number</label>
                <input type="tel" name="phone" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                    placeholder="+91 00000 00000">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Service Details</label>
                <textarea name="details" rows="3"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                    placeholder="Briefly describe your requirements..."></textarea>
            </div>

            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transform transition hover:-translate-y-1 active:scale-95">
                Submit Data to Sheet
            </button>

            <p class="text-center text-xs text-gray-400 mt-4">
                © 2026 Syed Natural Services. Secure & Encrypted.
            </p>
        </form>
    </div>

</body>
</html>
